<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrikaal Verse Pvt. Ltd.</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/thrikaal_logo.png" />
    <link rel="shortcut icon" type="image/png" href="/thrikaal_logo.png" />
    <link rel="apple-touch-icon" href="/thrikaal_logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #121212;
        --text-primary: #ffffff;
        --text-secondary: #9ca3af;
        --border-color: rgba(255, 255, 255, 0.1);
        --accent-orange: #f37321;
        --accent-teal: #2d6b7e;
        --accent-green: #227548;
        --current-accent: var(--accent-orange);
      }

      html {
        scrollbar-width: none;
        /* Firefox */
        -ms-overflow-style: none;
        /* IE and Edge */
        overflow: auto;
        height: 100%;
      }

      html::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      html.light {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --border-color: rgba(15, 23, 42, 0.1);
      }

      * {
        scrollbar-width: none;
        /* Firefox */
        -ms-overflow-style: none;
        /* IE and Edge */
      }

      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
        scrollbar-width: none;
        /* Firefox */
        -ms-overflow-style: none;
        /* IE and Edge */
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      h1,
      h2,
      h3,
      .font-heading {
        font-family: 'Space+Grotesk', sans-serif;
      }

      ::selection {
        background: var(--current-accent);
        color: white;
      }

      .theme-transition * {
        transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>

</html>
